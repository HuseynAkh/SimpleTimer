<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>SimpleTimer: timer, activity and Apple Watch</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Inter:wght@400;500;600&display=block">
  <link rel="stylesheet" href="gallery.css">
</head>
<body>
<main class="canvas">
  <header><div class="brand"><img class="brand-mark" src="../../App/Assets.xcassets/AppIcon.appiconset/AppIcon-Dark.png" alt="">SimpleTimer</div><p>iPhone + Apple Watch</p></header>
  <section class="timer"><h1>A little more <em>focus.</em></h1><div class="phone"><img src="../release-images/dashboard-running.png" alt="Running Work timer with a large Pause button between round End and Reset buttons"></div></section>
  <section class="activity"><h2>A <em>clearer</em> picture.</h2><div class="phone"><img src="../release-images/activity.png" alt="Sample Activity week with 20 hours 15 minutes, 56 sessions, 91 percent completed and a 17 day streak"></div></section>
  <section class="wrist"><h2>Within <em>reach.</em></h2><p>Control your iPhone timer from<br>your wrist or Lock Screen.</p><div class="watch"><img src="../release-images/watch.png" alt="Apple Watch Work timer with Pause, End and Reset controls"></div><div class="live"><img src="../release-images/live-activity.png" alt="Paused Work Live Activity with Resume, End and Reset controls"></div><div class="note">One timer. One history.<br>No account required.</div></section>
  <footer>Real simulator screens · Sample data · Decorative device frames</footer>
</main>
</body>
</html>
