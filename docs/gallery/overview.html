<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>SimpleTimer — timer, activity and Apple Watch</title>
  <link rel="stylesheet" href="gallery.css">
</head>
<body>
<main class="canvas">
  <header><div class="brand"><span class="brand-mark" aria-hidden="true"></span>SimpleTimer</div><p>iPhone + Apple Watch</p></header>
  <section class="timer"><h1>A little more focus.</h1><div class="phone"><img src="../release-images/dashboard-running.png" alt="Running Work timer with equal-size End, Pause and Reset controls"></div></section>
  <section class="activity"><h2>A clearer picture.</h2><div class="phone"><img src="../release-images/activity.png" alt="Sample Activity week with 20 hours 15 minutes, 56 sessions and 91 percent completion"></div></section>
  <section class="wrist"><h2>Within reach.</h2><p>Control your iPhone timer<br>from your wrist.</p><div class="watch"><img src="../release-images/watch.png" alt="Apple Watch Work timer with Pause, End and Reset controls"></div><div class="note">One timer. One history.<br>No account required.</div></section>
  <footer>Real simulator screens · Sample data · Decorative device frames</footer>
</main>
</body>
</html>
