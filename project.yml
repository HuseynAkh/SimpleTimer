name: SimpleTimer
options:
  bundleIdPrefix: org.example
  deploymentTarget:
    iOS: '17.0'
settings:
  base:
    SWIFT_VERSION: '5.0'
    TARGETED_DEVICE_FAMILY: '1'
    CODE_SIGN_STYLE: Automatic
    MARKETING_VERSION: '1.0'
    CURRENT_PROJECT_VERSION: '4'
    GENERATE_INFOPLIST_FILE: YES
configFiles:
  Debug: Config/Local.xcconfig
  Release: Config/Local.xcconfig
targets:
  SimpleTimer:
    type: application
    platform: iOS
    sources: [App, Core, Shared, Connectivity]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(SIMPLETIMER_BUNDLE_ID)
        TARGETED_DEVICE_FAMILY: '1'
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        INFOPLIST_KEY_CFBundleDisplayName: SimpleTimer
        INFOPLIST_KEY_NSSupportsLiveActivities: YES
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations: UIInterfaceOrientationPortrait
    info:
      path: App/Info.plist
      properties:
        CFBundleURLTypes:
          - CFBundleURLName: $(SIMPLETIMER_BUNDLE_ID)
            CFBundleURLSchemes: [simpletimer]
    dependencies:
      - target: SimpleTimerActivity
      - target: SimpleTimerWatch
  SimpleTimerActivity:
    type: app-extension
    platform: iOS
    sources: [LiveActivity, Shared, Core]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(SIMPLETIMER_BUNDLE_ID).Activity
        APPLICATION_EXTENSION_API_ONLY: YES
        SWIFT_ACTIVE_COMPILATION_CONDITIONS: "$(inherited) WIDGET_EXTENSION"
    info:
      path: LiveActivity/Info.plist
      properties:
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
  SimpleTimerWatch:
    type: application
    platform: watchOS
    deploymentTarget: '10.0'
    sources: [WatchApp, Core, Shared/Palette.swift]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(SIMPLETIMER_BUNDLE_ID).watchkitapp
        TARGETED_DEVICE_FAMILY: '4'
        SDKROOT: watchos
        INFOPLIST_KEY_WKCompanionAppBundleIdentifier: $(SIMPLETIMER_BUNDLE_ID)
        INFOPLIST_KEY_WKApplication: YES
        INFOPLIST_KEY_CFBundleDisplayName: SimpleTimer
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon

schemes:
  SimpleTimer:
    build:
      targets:
        SimpleTimer: all

  SimpleTimerWatch:
    build:
      targets:
        SimpleTimerWatch: all
