name: Core tests
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Check source and commit metadata
        run: python3 scripts/audit-public.py --staged --history HEAD
      - name: Test publishing privacy guards
        run: python3 scripts/test-public-guard.py
      - name: Test timer, history, backups and watch commands
        run: swift test
